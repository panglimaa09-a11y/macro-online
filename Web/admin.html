<!DOCTYPE html>
<html lang="id">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Macro Online Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#070b12;color:#f5f7fa;font-family:Arial,sans-serif}.wrap{width:min(1100px,calc(100% - 32px));margin:auto;padding:30px 0 60px}.card{background:#0d121c;border:1px solid #202a3a;border-radius:16px;padding:20px;margin-bottom:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}label{display:block;color:#9da8ba;font-size:12px;margin-bottom:7px}input,textarea{width:100%;background:#090e16;color:#f5f7fa;border:1px solid #293448;border-radius:10px;padding:11px;outline:none;font:inherit}textarea{min-height:90px;resize:vertical}button{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}.save{background:#f4f6f8;color:#070b12}.secondary{background:#202a3a;color:#fff}.danger{background:#5b2026;color:#fff}.msg{margin-top:12px;color:#62d391;font-size:13px}.login{max-width:460px;margin:12vh auto}.hidden{display:none}.step{border:1px solid #202a3a;border-radius:12px;padding:14px;margin-bottom:10px}.actions{display:flex;gap:10px;flex-wrap:wrap}.muted{color:#8994a7;font-size:13px;line-height:1.6}@media(max-width:720px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head>
<body>
<div id="login" class="wrap login"><div class="card"><h2>Macro Online Admin</h2><p class="muted">Edit seluruh teks dan blok Home Macro Online.</p><label>Password Admin</label><input id="password" type="password" placeholder="Masukkan password"><button class="save" id="loginBtn" style="margin-top:12px">MASUK ADMIN</button><div id="loginMsg" class="msg"></div></div></div>
<div id="app" class="wrap hidden"><div class="card"><h2>Macro Online Admin</h2><p class="muted">Semua perubahan disimpan lokal di browser ini. Gunakan EXPORT CONFIG untuk backup.</p><div class="actions"><button class="secondary" id="homeBtn">BUKA HOME</button><button class="secondary" id="exportBtn">EXPORT CONFIG</button><label style="display:inline-flex;align-items:center;gap:8px;padding:12px 16px;background:#202a3a;border-radius:10px;color:#fff;cursor:pointer"><input id="importFile" type="file" accept="application/json" style="width:auto"> IMPORT CONFIG</label></div></div>
<div class="card"><h3>Brand & Hero</h3><div class="grid"><div><label>Logo</label><input data-key="logo"></div><div><label>Nama Brand</label><input data-key="brand"></div><div><label>Subtitle</label><input data-key="subtitle"></div><div><label>Hero Eyebrow</label><input data-key="heroEyebrow"></div><div><label>Hero Title</label><input data-key="heroTitle"></div><div class="full"><label>Hero Description</label><textarea data-key="heroDescription"></textarea></div><div><label>START Button</label><input data-key="startButton"></div><div><label>AKTIFKAN Button</label><input data-key="enableButton"></div><div><label>MATIKAN Button</label><input data-key="disableButton"></div></div></div>
<div class="card"><h3>Runtime</h3><div class="grid"><div><label>Runtime Eyebrow</label><input data-key="runtimeEyebrow"></div><div><label>Runtime Heading</label><input data-key="runtimeHeading"></div><div><label>Runtime Label</label><input data-key="runtimeLabel"></div><div><label>Engine</label><input data-key="engineValue"></div><div><label>Trigger</label><input data-key="triggerValue"></div><div><label>Connection</label><input data-key="connectionValue"></div><div class="full"><label>Runtime Help</label><textarea data-key="runtimeHelp"></textarea></div></div></div>
<div class="card"><h3>PowerShell</h3><div class="grid"><div class="full"><label>Command</label><textarea data-key="psCommand" style="min-height:180px"></textarea></div><div><label>Header</label><input data-key="psHeader"></div><div><label>Copy Button</label><input data-key="copyButton"></div><div class="full"><label>Note</label><textarea data-key="psNote"></textarea></div></div></div>
<div class="card"><h3>Download</h3><div class="grid"><div><label>Eyebrow</label><input data-key="downloadEyebrow"></div><div><label>Heading</label><input data-key="downloadHeading"></div><div class="full"><label>Description</label><textarea data-key="downloadDescription"></textarea></div><div><label>Button</label><input data-key="downloadButton"></div><div class="full"><label>URL</label><input data-key="downloadUrl"></div></div></div>
<div class="card"><h3>Panduan 8 Langkah</h3><div id="steps"></div></div>
<div class="card"><h3>Sequence & Notice</h3><div class="grid"><div><label>Sequence Eyebrow</label><input data-key="sequenceEyebrow"></div><div><label>Sequence Heading</label><input data-key="sequenceHeading"></div><div><label>Sequence</label><input data-key="sequence"></div><div class="full"><label>Notice</label><textarea data-key="notice"></textarea></div></div></div>
<div class="card"><button class="save" id="saveBtn">SIMPAN SEMUA PERUBAHAN</button><button class="secondary" id="resetBtn" style="margin-left:8px">RESET DEFAULT</button><div id="saveMsg" class="msg"></div></div></div>
<script>
const KEY='macro_online_admin_config',PASS='macro_online_admin_password';
const defaults={logo:'MO',brand:'Macro Online',subtitle:'Windows Macro Control Center',heroEyebrow:'Macro Control',heroTitle:'Macro Online',heroDescription:'Macro Online adalah control center web untuk mengendalikan MacroForge Runtime di Windows. Engine V7.4 tetap berjalan lokal di PC Windows. Sequence macro: LMB → RMB → LMB → Q → Q.',startButton:'START MACRO ONLINE',enableButton:'AKTIFKAN MACRO',disableButton:'MATIKAN MACRO',runtimeEyebrow:'Runtime',runtimeHeading:'System Status',runtimeLabel:'Runtime',engineValue:'V7.4',triggerValue:'Physical RMB',connectionValue:'Auto',runtimeHelp:'Jika halaman ini dibuka dari Runtime Tunnel, koneksi WebSocket diisi otomatis. Tidak perlu copy token.',psCommand:"$ErrorActionPreference='Stop'; $u='https://github.com/panglimaa09-a11y/macro-online/archive/refs/heads/main.zip'; $z=Join-Path $env:TEMP 'macro-online-main.zip'; $d=Join-Path $env:USERPROFILE 'Macro Online'; Invoke-WebRequest -UseBasicParsing $u -OutFile $z; if(Test-Path $d){Remove-Item $d -Recurse -Force}; Expand-Archive $z -DestinationPath $env:TEMP -Force; Move-Item (Join-Path $env:TEMP 'macro-online-main') $d; Remove-Item $z -Force; powershell.exe -ExecutionPolicy Bypass -File (Join-Path $d 'Runtime\\START-PUBLIC-RUNTIME.ps1')",psHeader:'PowerShell — One Command Setup & Start',copyButton:'COPY COMMAND',psNote:'Setelah Enter, Runtime akan membuka dashboard melalui tunnel secara otomatis. Biarkan window Runtime tetap terbuka.',downloadEyebrow:'Download',downloadHeading:'Macro Online Package',downloadDescription:'Paket berisi Runtime, Engine V7.4, launcher, dan Web.',downloadButton:'DOWNLOAD ZIP',downloadUrl:'https://github.com/panglimaa09-a11y/macro-online/archive/refs/heads/main.zip',sequenceEyebrow:'Current Macro',sequenceHeading:'Sequence',sequence:'LMB → RMB → LMB → Q → Q',notice:'Vercel adalah interface. Runtime dan Engine V7.4 berjalan lokal di Windows. Engine V7.4 tidak diubah.'};
Object.assign(defaults,{step1Title:'01 — START',step1Text:'Jalankan command PowerShell satu kali.',step2Title:'02 — ONLINE',step2Text:'Tunggu sampai Runtime Online dan dashboard terbuka otomatis.',step3Title:'03 — AKTIFKAN',step3Text:'Klik AKTIFKAN MACRO. Dashboard mengirim F6 ke Engine.',step4Title:'04 — TRIGGER',step4Text:'Tekan Physical RMB untuk memulai macro.',step5Title:'05 — SEQUENCE',step5Text:'LMB → RMB → LMB → Q → Q.',step6Title:'06 — SELESAI',step6Text:'Macro selesai setelah Q kedua.',step7Title:'07 — OFF',step7Text:'Klik MATIKAN MACRO. Dashboard mengirim F7.',step8Title:'08 — TUTUP',step8Text:'Baru tutup Runtime jika sudah selesai.'});
let config={...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')};
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function render(){document.querySelectorAll('[data-key]').forEach(e=>e.value=config[e.dataset.key]??'');let b=document.getElementById('steps');b.innerHTML='';for(let i=1;i<=8;i++)b.innerHTML+=`<div class="step"><label>Langkah ${i} Judul</label><input data-key="step${i}Title" value="${esc(config['step'+i+'Title'])}"><label style="margin-top:8px">Langkah ${i} Deskripsi</label><textarea data-key="step${i}Text">${esc(config['step'+i+'Text'])}</textarea></div>`}
function collect(){document.querySelectorAll('[data-key]').forEach(e=>config[e.dataset.key]=e.value)}
function show(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');render()}
if(!localStorage.getItem(PASS))localStorage.setItem(PASS,'admin123');
document.getElementById('loginBtn').onclick=()=>{if(document.getElementById('password').value===localStorage.getItem(PASS))show();else document.getElementById('loginMsg').textContent='Password salah.'};
document.getElementById('saveBtn').onclick=()=>{collect();localStorage.setItem(KEY,JSON.stringify(config));document.getElementById('saveMsg').textContent='✓ SEMUA PERUBAHAN BERHASIL DISIMPAN. Buka Home untuk melihat hasil.'};
document.getElementById('resetBtn').onclick=()=>{config={...defaults};localStorage.setItem(KEY,JSON.stringify(config));render();document.getElementById('saveMsg').textContent='Default dipulihkan.'};
document.getElementById('homeBtn').onclick=()=>location.href='./';
document.getElementById('exportBtn').onclick=()=>{collect();let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(config,null,2)],{type:'application/json'}));a.download='macro-online-config.json';a.click()};
document.getElementById('importFile').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{config={...defaults,...JSON.parse(r.result)};render();document.getElementById('saveMsg').textContent='Config diimpor. Klik SIMPAN SEMUA PERUBAHAN.'}catch(_){document.getElementById('saveMsg').textContent='Config tidak valid.'}};r.readAsText(f)};
</script></body></html>
